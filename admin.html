<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>稲穂 発注管理画面</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f5f5f5;color:#1a1a1a;font-size:14px;}
.header{background:#fff;border-bottom:1px solid #e0e0e0;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,0.08);display:flex;justify-content:space-between;align-items:center;}
.header h1{font-size:19px;font-weight:600;}
.ver{font-size:11px;color:#bbb;}
.tab-bar{display:flex;background:#fff;border-bottom:1px solid #e0e0e0;}
.tab-btn{flex:1;padding:12px 6px;font-size:14px;color:#888;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;}
.tab-btn.active{color:#1a1a1a;border-bottom:2px solid #1a1a1a;font-weight:600;}
.filter-section{background:#fff;border-bottom:1px solid #e0e0e0;padding:10px 14px;display:flex;flex-direction:column;gap:8px;}
.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.filter-row input,.filter-row select{width:100%;font-size:15px;padding:9px 10px;border:1px solid #d0d0d0;border-radius:8px;background:#fafafa;color:#1a1a1a;}
.count-info{padding:8px 14px;font-size:12px;color:#888;}
.list{padding:0 14px 40px;}
.item{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:12px;margin-bottom:10px;}
.item-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px;}
.draft-badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600;background:#FFF8E1;color:#E65100;}
.item-meta{font-size:12px;color:#888;margin-top:4px;line-height:1.6;}
.item-btns{display:flex;gap:8px;margin-top:10px;}
.btn{flex:1;padding:9px;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;text-align:center;border:none;}
.btn-dl{background:#1565C0;color:#fff;}
.btn-del{background:#fff;color:#e53935;border:1px solid #e53935;}
.btn-restore{background:#2E7D32;color:#fff;}
.empty{text-align:center;padding:50px 14px;color:#aaa;font-size:13px;}
.loading{text-align:center;padding:50px 14px;color:#aaa;font-size:13px;}
.error{text-align:center;padding:50px 14px;color:#e53935;font-size:13px;}
.db-wrap{padding:0 0 40px;overflow-x:auto;}
.db-table{border-collapse:collapse;font-size:12px;white-space:nowrap;min-width:100%;}
.db-table th,.db-table td{border:1px solid #e0e0e0;padding:6px 9px;text-align:left;vertical-align:top;}
.db-table th{background:#fafafa;font-weight:600;position:sticky;top:0;}
.db-table tr.deleted td{background:#fff3f3;color:#b71c1c;}
.db-table td.wrap{white-space:normal;max-width:260px;word-break:break-word;}
.db-table .mono{font-family:ui-monospace,Menlo,Consolas,monospace;}
.db-qty{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;font-size:11px;max-width:340px;}
.prod-filter{background:#fff;border-bottom:1px solid #e0e0e0;padding:10px 14px;display:flex;flex-direction:column;gap:8px;}
.prod-filter input[type=text]{width:100%;font-size:15px;padding:9px 10px;border:1px solid #d0d0d0;border-radius:8px;background:#fafafa;color:#1a1a1a;}
.prod-kubuns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.kubun-btn{padding:6px 11px;font-size:12px;border:1px solid #d0d0d0;border-radius:7px;background:#fff;color:#555;cursor:pointer;}
.kubun-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.oos-toggle{margin-left:auto;font-size:12px;color:#555;display:flex;align-items:center;gap:5px;cursor:pointer;}
.db-table td.instock{color:#2E7D32;}
.db-table td.outstock{color:#c62828;}
.p-pdf-btn{padding:7px 12px;font-size:12px;font-weight:600;border:1px solid #1565C0;color:#1565C0;background:#fff;border-radius:7px;cursor:pointer;}
#print-area{display:none;}
@media print{
  body>*{display:none !important;}
  #print-area{display:block !important;padding:0;}
  #print-area h2{font-size:15px;margin:0 0 4px;}
  #print-area .p-cond{font-size:11px;color:#333;margin-bottom:8px;}
  #print-area table{border-collapse:collapse;width:100%;font-size:10px;}
  #print-area th,#print-area td{border:1px solid #999;padding:3px 5px;text-align:left;}
  #print-area th{background:#eee;}
}
</style>
</head>
<body>
<div class="header"><h1>稲穂 発注管理画面</h1><span class="ver">ver 1.7</span></div>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-btn-active" onclick="switchTab('active')">保存データ</button>
  <button class="tab-btn" id="tab-btn-trash" onclick="switchTab('trash')">ゴミ箱</button>
  <button class="tab-btn" id="tab-btn-db" onclick="switchTab('db')">一覧</button>
  <button class="tab-btn" id="tab-btn-products" onclick="switchTab('products')">商品</button>
</div>

<div class="filter-section" id="filter-section">
  <div class="filter-row">
    <input type="text" id="f-store" placeholder="店舗名で検索" oninput="render()">
    <select id="f-author" onchange="render()">
      <option value="">担当者すべて</option>
      <option value="長谷川">長谷川</option>
      <option value="梅田">梅田</option>
      <option value="福富">福富</option>
      <option value="阿部">阿部</option>
    </select>
  </div>
  <div class="filter-row">
    <input type="date" id="f-date" onchange="render()">
    <button onclick="clearFilters()" style="padding:9px;font-size:13px;color:#666;border:1px solid #d0d0d0;border-radius:8px;background:#fff;cursor:pointer;">絞り込み解除</button>
  </div>
</div>

<div class="prod-filter" id="prod-filter" style="display:none;">
  <input type="text" id="p-search" placeholder="品名・コード・品番で検索" oninput="renderProducts()">
  <div class="prod-kubuns" id="p-kubuns">
    <button class="kubun-btn active" data-k="" onclick="setKubun(this)">全て</button>
    <button class="kubun-btn" data-k="1000均" onclick="setKubun(this)">1000均</button>
    <button class="kubun-btn" data-k="600均" onclick="setKubun(this)">600均</button>
    <button class="kubun-btn" data-k="EDLP" onclick="setKubun(this)">EDLP</button>
    <label class="oos-toggle"><input type="checkbox" id="p-oos" onchange="renderProducts()">在庫なしのみ</label>
  </div>
  <button class="p-pdf-btn" onclick="printProducts()">この一覧をPDF出力</button>
</div>

<div id="print-area"></div>

<div class="count-info" id="count-info"></div>
<div class="list" id="list"></div>

<script>
const SERVER = 'https://order-app-c15s.onrender.com';
let allOrders = [];
let currentTab = 'active';
let productsData = null;
let oosMap = {};
let prodKubun = '';
let lastProdFiltered = [];

function switchTab(tab){
  currentTab = tab;
  ['active','trash','db','products'].forEach(function(t){
    document.getElementById('tab-btn-'+t).classList.toggle('active', tab===t);
  });
  const isProd = tab==='products';
  document.getElementById('filter-section').style.display = isProd ? 'none' : '';
  document.getElementById('prod-filter').style.display = isProd ? '' : 'none';
  if(isProd && !productsData){ loadProducts(); return; }
  render();
}

function setKubun(btn){
  prodKubun = btn.getAttribute('data-k');
  document.querySelectorAll('#p-kubuns .kubun-btn').forEach(function(b){
    b.classList.toggle('active', b===btn);
  });
  renderProducts();
}

async function loadProducts(){
  document.getElementById('list').innerHTML = '<div class="loading">読み込み中...</div>';
  try{
    const [pr, or] = await Promise.all([
      fetch('発注書_商品マスタ.json'),
      fetch(SERVER+'/out_of_stock')
    ]);
    if(!pr.ok) throw new Error('products '+pr.status);
    productsData = await pr.json();
    oosMap = {};
    if(or.ok){
      (await or.json()).forEach(function(e){
        const code = Array.isArray(e) ? e[0] : e.code;
        const date = Array.isArray(e) ? e[1] : e.date;
        if(code) oosMap[String(code)] = date || '';
      });
    }
    renderProducts();
  }catch(e){
    document.getElementById('list').innerHTML = '<div class="error">商品マスタの読み込みに失敗しました。時間をおいて再読み込みしてください</div>';
    document.getElementById('count-info').textContent = '';
  }
}

function renderProducts(){
  if(!productsData) return;
  const q = document.getElementById('p-search').value.trim().toLowerCase();
  const oosOnly = document.getElementById('p-oos').checked;
  const rows = [];
  [['inaho','稲穂'],['sankyo','三共']].forEach(function(pair){
    (productsData[pair[0]]||[]).forEach(function(p){
      rows.push({sup:pair[1], kubun:p.kubun||'', code:String(p.code||''), name:p.name||'', hiban:p.hiban||''});
    });
  });
  const filtered = rows.filter(function(r){
    if(prodKubun && r.kubun!==prodKubun) return false;
    if(oosOnly && !(r.code in oosMap)) return false;
    if(q){
      const hay = (r.code+' '+r.name+' '+r.hiban).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });
  lastProdFiltered = filtered;
  document.getElementById('count-info').textContent = filtered.length + '件';
  if(!filtered.length){
    document.getElementById('list').innerHTML = '<div class="empty">該当商品なし</div>';
    return;
  }
  const head = '<tr><th>仕入先</th><th>区分</th><th>コード</th><th>品名</th><th>品番</th><th>在庫</th></tr>';
  const body = filtered.map(function(r){
    const isOos = r.code in oosMap;
    const stock = isOos
      ? '在庫なし'+(oosMap[r.code] ? '（'+oosMap[r.code]+'〜）' : '')
      : '在庫あり';
    return '<tr>'
      + '<td>'+escapeHtml(r.sup)+'</td>'
      + '<td>'+escapeHtml(r.kubun)+'</td>'
      + '<td class="mono">'+escapeHtml(r.code)+'</td>'
      + '<td class="wrap">'+escapeHtml(r.name)+'</td>'
      + '<td class="mono">'+escapeHtml(r.hiban)+'</td>'
      + '<td class="'+(isOos?'outstock':'instock')+'">'+escapeHtml(stock)+'</td>'
      + '</tr>';
  }).join('');
  document.getElementById('list').innerHTML =
    '<div class="db-wrap"><table class="db-table">'+head+body+'</table></div>';
}

function renderDbTable(){
  const store = document.getElementById('f-store').value.trim().toLowerCase();
  const author = document.getElementById('f-author').value;
  const date = document.getElementById('f-date').value;
  const rows = allOrders.filter(function(o){
    if(author && o.author!==author) return false;
    if(date && o.date!==date) return false;
    if(store){
      const names=(o.stores||[]).map(function(s){return (s.name||'').toLowerCase();}).join(' ');
      if(names.indexOf(store)===-1) return false;
    }
    return true;
  });
  document.getElementById('count-info').textContent = rows.length + '件（発注 / 下書き・削除済み含む）';
  if(!rows.length){
    document.getElementById('list').innerHTML = '<div class="empty">該当データなし</div>';
    return;
  }
  const head = '<tr><th>日付</th><th>種別</th><th>担当者</th><th>店舗</th>'
    + '<th>作成日時</th><th>送信日時</th><th>状態</th></tr>';
  const body = rows.slice().map(function(o){
    const isDraft = o.label && o.label.startsWith('__draft__');
    const stores = (o.stores||[]).map(function(s){return s.name;}).filter(Boolean).join('・') || '-';
    const status = o.mail_sent_at ? '送信済み' : (o.deleted ? '手動削除' : '有効');
    return '<tr'+(o.deleted?' class="deleted"':'')+'>'
      + '<td>'+escapeHtml(o.date||'-')+'</td>'
      + '<td>'+(isDraft?'下書き':'発注')+'</td>'
      + '<td>'+escapeHtml(o.author||'-')+'</td>'
      + '<td class="wrap">'+escapeHtml(stores)+'</td>'
      + '<td class="mono">'+escapeHtml(formatCreatedAtJST(o.created_at))+'</td>'
      + '<td class="mono">'+escapeHtml(formatCreatedAtJST(o.mail_sent_at))+'</td>'
      + '<td>'+status+'</td>'
      + '</tr>';
  }).join('');
  document.getElementById('list').innerHTML =
    '<div class="db-wrap"><table class="db-table">'+head+body+'</table></div>';
}

function printProducts(){
  if(!lastProdFiltered.length){ alert('該当商品がありません'); return; }
  const kubunLabel = prodKubun || '全て';
  const q = document.getElementById('p-search').value.trim();
  const oosOnly = document.getElementById('p-oos').checked;
  const today = new Date();
  const dstr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  const cond = '区分: '+kubunLabel+' ／ 検索: '+(q||'（なし）')
    +' ／ 在庫なしのみ: '+(oosOnly?'✓':'—')
    +' ／ '+lastProdFiltered.length+'件 ／ 出力日: '+dstr;
  const rows = lastProdFiltered.map(function(r){
    const isOos = r.code in oosMap;
    const stock = isOos ? '在庫なし'+(oosMap[r.code] ? '（'+oosMap[r.code]+'〜）' : '') : '在庫あり';
    return '<tr><td>'+escapeHtml(r.sup)+'</td><td>'+escapeHtml(r.kubun)+'</td>'
      + '<td>'+escapeHtml(r.code)+'</td><td>'+escapeHtml(r.name)+'</td>'
      + '<td>'+escapeHtml(r.hiban)+'</td><td>'+escapeHtml(stock)+'</td></tr>';
  }).join('');
  document.getElementById('print-area').innerHTML =
    '<h2>稲穂 商品一覧</h2><div class="p-cond">'+escapeHtml(cond)+'</div>'
    + '<table><tr><th>仕入先</th><th>区分</th><th>コード</th><th>品名</th><th>品番</th><th>在庫</th></tr>'
    + rows + '</table>';
  window.print();
}

function clearFilters(){
  document.getElementById('f-store').value='';
  document.getElementById('f-author').value='';
  document.getElementById('f-date').value='';
  render();
}

async function loadOrders(){
  document.getElementById('list').innerHTML = '<div class="loading">読み込み中...</div>';
  try{
    const res = await fetch(SERVER+'/admin/orders');
    if(!res.ok) throw new Error('status '+res.status);
    allOrders = await res.json();
    render();
  }catch(e){
    document.getElementById('list').innerHTML = '<div class="error">データベースへの接続に失敗しました。しばらくしてから再度お試しいただくか、時間をおいて再読み込みしてください</div>';
    document.getElementById('count-info').textContent = '';
  }
}

function render(){
  if(currentTab==='products'){ renderProducts(); return; }
  if(currentTab==='db'){ renderDbTable(); return; }
  const store = document.getElementById('f-store').value.trim().toLowerCase();
  const author = document.getElementById('f-author').value;
  const date = document.getElementById('f-date').value;

  let filtered = allOrders.filter(function(o){
    if(currentTab==='active' && o.deleted) return false;
    if(currentTab==='trash' && !o.deleted) return false;
    if(author && o.author!==author) return false;
    if(date && o.date!==date) return false;
    if(store){
      const names = (o.stores||[]).map(function(s){return (s.name||'').toLowerCase();}).join(' ');
      if(names.indexOf(store)===-1) return false;
    }
    return true;
  });

  document.getElementById('count-info').textContent = filtered.length + '件';

  if(!filtered.length){
    document.getElementById('list').innerHTML = '<div class="empty">該当データなし</div>';
    return;
  }

  const html = filtered.slice().map(function(o){
    const isDraft = o.label && o.label.startsWith('__draft__');
    const label = isDraft ? (o.author||'') + 'の下書き' : (o.label || o.date || o.id);
    const stores = (o.stores||[]).map(function(s){return s.name;}).filter(Boolean).join('・');
    const btns = currentTab==='trash'
      ? '<button class="btn btn-restore" onclick="restoreOrder(\''+o.id+'\')">復元</button>'
      : '<button class="btn btn-dl" onclick="downloadExcel(\''+o.id+'\')">Excel</button>'
        + '<button class="btn btn-del" onclick="deleteOrder(\''+o.id+'\')">削除</button>';
    return '<div class="item">'
      + '<div class="item-title">'+(isDraft?'<span class="draft-badge">下書き</span>':'')+escapeHtml(label)+'</div>'
      + '<div class="item-meta">'
      + '担当者: '+escapeHtml(o.author||'-')+'<br>'
      + '店舗: '+escapeHtml(stores||'-')+'<br>'
      + '日付: '+escapeHtml(o.date||'-')+'<br>'
      + '作成日時: '+escapeHtml(formatCreatedAtJST(o.created_at))
      + (o.mail_sent_at ? '<br>送信日時: '+escapeHtml(formatCreatedAtJST(o.mail_sent_at)) : '')
      + '</div>'
      + '<div class="item-btns">'+btns+'</div>'
      + '</div>';
  }).join('');
  document.getElementById('list').innerHTML = html;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function formatCreatedAtJST(isoStr){
  if(!isoStr) return '-';
  try{
    const iso = /[Zz]|[+-]\d\d:\d\d$/.test(isoStr) ? isoStr : isoStr + 'Z';
    const d = new Date(iso);
    if(isNaN(d.getTime())) return isoStr.replace('T',' ').slice(0,16);
    return d.toLocaleString('sv-SE', {timeZone:'Asia/Tokyo'}).slice(0,16);
  }catch(e){
    return isoStr.replace('T',' ').slice(0,16);
  }
}

function downloadExcel(id){
  window.open(SERVER+'/orders/'+id+'/excel', '_blank');
}

async function deleteOrder(id){
  if(!confirm('このデータをゴミ箱に移動しますか？（管理画面から復元できます）')) return;
  try{
    const res = await fetch(SERVER+'/orders/'+id, {method:'DELETE'});
    if(!res.ok) throw new Error('status '+res.status);
    await loadOrders();
  }catch(e){
    alert('削除に失敗しました。しばらくしてから再度お試しください');
  }
}

async function restoreOrder(id){
  try{
    const res = await fetch(SERVER+'/orders/'+id+'/restore', {method:'POST'});
    if(!res.ok) throw new Error('status '+res.status);
    await loadOrders();
  }catch(e){
    alert('復元に失敗しました。しばらくしてから再度お試しください');
  }
}

loadOrders();
</script>
</body>
</html>
