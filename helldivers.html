<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ヘルダイバーズ2 装備選択ツール</title>
<script src="helldivers_data.js?v=1.16.1"></script>
<style>
  :root {
    --bg: #11151a; --panel: #1b2128; --panel2: #232b34; --border: #333c47;
    --text: #e8edf2; --sub: #9aa7b3; --accent: #ffb020; --accent2: #3aa0ff;
    --danger: #ff5a5a; --ok: #4fd37a;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: "Hiragino Sans","Meiryo",sans-serif; padding-bottom: 60px; }
  h1 { font-size: 18px; padding: 14px 12px 6px; margin:0; }
  h2 { font-size: 15px; margin: 0 0 8px; color: var(--accent); }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 10px; }
  .note { font-size: 12px; color: var(--sub); padding: 0 12px 10px; }
  .section { background: var(--panel); border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background: var(--panel2); border:1px solid var(--border); border-radius: 10px; padding:8px 10px; display:flex; align-items:center; gap:8px; max-width: 100%; }
  .chip.filled { border-color: var(--accent); }
  .chip .lbl { font-size:11px; color: var(--sub); }
  .chip .val { font-size:13px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:140px; }
  .chip.target .val { max-width:none; white-space:normal; overflow:visible; text-overflow:clip; }
  .chip.target .qtyval { font-size:13px; font-weight:bold; min-width:1.5em; text-align:center; display:inline-block; }
  .chip button { background:var(--accent); color:#1b1400; border:none; border-radius:6px; padding:5px 9px; font-size:12px; font-weight:bold; }
  .tabbar { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
  .tab { flex: 0 0 auto; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:999px; padding:7px 13px; font-size:12px; white-space:nowrap; }
  .tab.active { background:var(--accent); color:#1b1400; border-color:var(--accent); font-weight:bold; }
  input[type=text], input[type=search], select {
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:9px 10px; font-size:14px; margin-bottom:8px;
  }
  .btn { background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:9px 12px; font-size:13px; }
  .btn.primary { background:var(--accent); color:#1b1400; border-color:var(--accent); font-weight:bold; }
  .btn.danger { background: #3a1414; border-color: var(--danger); color: var(--danger); }
  .itemcard { background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; }
  .itemcard.selected { border-color: var(--accent); background:#2a2416; }
  .itemcard.disabled { opacity:0.35; }
  .itemcard .name { font-weight:bold; font-size:14px; margin-bottom:4px; }
  .itemcard .cat { font-size:11px; color:var(--sub); margin-bottom:6px; }
  .statrow { display:flex; flex-wrap:wrap; gap:6px; }
  .stat { background: var(--bg); border-radius:6px; padding:3px 8px; font-size:11px; color:var(--sub); }
  .traits { font-size:11px; color: var(--accent2); margin-top:4px; }
  .picker-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .closebtn { background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 10px; font-size:12px; }
  .savebar { display:flex; gap:8px; }
  .savebar input { flex:1; margin-bottom:0; }
  .loadout-card { background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; }
  .loadout-card .title { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .loadout-card .title b { font-size:14px; }
  .tag { background:var(--bg); color:var(--sub); border-radius:6px; padding:3px 8px; font-size:11px; margin:2px; display:inline-block; }
  .tag.strat { color: var(--accent2); }
  .tag.boost { color: var(--ok); }
  .smallbtn { background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:4px 8px; font-size:12px; margin-left:4px; }
  .enemy-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; }
  @media (min-width: 560px) { .enemy-grid { grid-template-columns: repeat(3, 1fr); } }
  .part-card { background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:8px; text-align:center; cursor:pointer; }
  .part-card.selected { border-color: var(--accent); }
  .part-card .pname { font-size:13px; font-weight:bold; margin-bottom:3px; }
  .part-card .psub { font-size:11px; color:var(--sub); margin:1px 0; }
  .badge { font-size:10px; border-radius:6px; padding:2px 6px; display:inline-block; margin-top:4px; }
  .badge.fatal { background:#3a1414; color:var(--danger); }
  .badge.nonfatal { background:var(--bg); color:var(--sub); }
  .lookup-group { margin-bottom:10px; }
  .lookup-title.full { color: var(--ok); }
  .lookup-title.half { color: var(--accent); }
  .lookup-item { display:inline-flex; align-items:stretch; margin:3px; border-radius:8px; overflow:hidden; }
  .lookup-btn { background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:0; padding:6px 10px; font-size:12px; margin:0; }
  .lookup-btn.full { border-color: var(--ok); }
  .lookup-btn.half { border-color: var(--accent); }
  .lookup-detail-btn { background:var(--panel2); border:1px solid var(--border); border-left:none; color:var(--sub); padding:6px 10px; font-size:13px; min-width:34px; }
  .lookup-btn.full + .lookup-detail-btn { border-color: var(--ok); border-left:none; }
  .lookup-btn.half + .lookup-detail-btn { border-color: var(--accent); border-left:none; }
  .lookup-btn.slot-primary { background:#993556; color:#F4C0D1; }
  .lookup-btn.slot-secondary { background:#0C447C; color:#B5D4F4; }
  .lookup-btn.slot-grenade { background:#712B13; color:#F5C4B3; }
  .lookup-btn.slot-stratagem { background:#085041; color:#9FE1CB; }
  .lookup-legend { display:flex; gap:10px; flex-wrap:wrap; font-size:11px; color:var(--sub); margin:0 0 8px; }
  .lookup-legend .dot { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--accent); color:#1b1400; padding:9px 16px; border-radius:8px; font-size:13px; font-weight:bold; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.show { opacity:1; }
  .hint { font-size:11px; color:var(--sub); margin-top:8px; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; z-index:1000; padding:16px; }
  .modal-box { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; max-width:92vw; max-height:85vh; overflow-y:auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ヘルダイバーズ2 装備選択ツール <span id="verTag" style="font-size:12px; color:#ffffff; font-weight:normal;"></span></h1>
  <p class="note">保存したロードアウトはこの端末・このブラウザにのみ保存されます（他の端末とは共有されません）。</p>

  <div class="section" id="slotsSection">
    <div class="picker-head">
      <h2 style="margin:0;">現在のロードアウト</h2>
      <button class="btn danger" onclick="clearLoadout()">クリア</button>
    </div>
    <div class="chips" id="slotChips"></div>
    <div class="savebar" style="margin-top:10px;">
      <input type="text" id="saveName" placeholder="保存名（例：対ターミニッド重装編成）">
      <button class="btn primary" onclick="saveLoadout()">保存</button>
    </div>
  </div>

  <div class="section" id="pickerSection" style="display:none;"></div>

  <div class="section" id="browseSection">
    <div class="picker-head" onclick="toggleBrowse()" style="cursor:pointer;">
      <h2 style="margin:0;">装備データ一覧（閲覧のみ） <span id="browseToggleIcon">▶</span></h2>
    </div>
    <div id="browseBody" style="display:none;">
      <p class="hint" style="margin-top:0;">ロードアウトには影響しません。全データをここで一覧確認できます。</p>
      <div class="tabbar" id="browseTypeTabs"></div>
      <div class="tabbar" id="browseCatTabs" style="margin-top:6px;"></div>
      <input type="search" id="browseSearch" placeholder="名前で検索" oninput="setBrowseQuery(this.value)">
      <div id="browseList"></div>
    </div>
  </div>

  <div class="section" id="savedSection">
    <h2>保存済みロードアウト</h2>
    <div id="savedList"></div>
  </div>

  <div class="section" id="enemySection">
    <div class="picker-head" onclick="toggleEnemy()" style="cursor:pointer;">
      <h2 style="margin:0;">大型敵図鑑（装甲貫通チェック） <span id="enemyToggleIcon">▶</span></h2>
    </div>
    <div id="enemySectionBody" style="display:none;">
      <div class="tabbar" id="factionTabs"></div>
      <div class="chips" id="enemyChips" style="margin:10px 0;"></div>
      <div id="enemyBody"></div>
    </div>
  </div>

  <div class="section" id="simSection">
    <div class="picker-head" onclick="toggleSim()" style="cursor:pointer;">
      <h2 style="margin:0;">撃破時間計算（対戦車ランク武器のみ） <span id="simToggleIcon">▶</span></h2>
    </div>
    <div id="simBody" style="display:none;">
      <p class="hint" style="margin-top:0;">複数の大型敵・部位を好きな数だけ組み合わせて、対戦車ランク武器ごとの推定撃破時間をランキング表示します。</p>
      <div class="chips" style="margin-bottom:8px;">
        <select id="simEnemySelect" style="margin-bottom:0; width:auto;" onchange="onSimEnemyChange()"></select>
        <select id="simPartSelect" style="margin-bottom:0; width:auto;"></select>
        <span class="chip" style="padding:4px 6px;">
          <button class="smallbtn" onclick="stepSimQty(-1)">−</button>
          <span id="simQtyDisplay" style="min-width:1.5em; text-align:center; display:inline-block; font-weight:bold;">1</span>
          <button class="smallbtn" onclick="stepSimQty(1)">＋</button>
        </span>
        <button class="btn primary" onclick="addSimTarget()">追加</button>
      </div>
      <div id="simTargetList" class="chips" style="margin-bottom:10px;"></div>
      <div class="chips" style="margin-bottom:8px;" id="simGroupToggles"></div>
      <div id="simResult"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="itemDetailOverlay" style="display:none;" onclick="if(event.target===this) closeItemDetail()">
  <div class="modal-box" id="itemDetailBox"></div>
</div>

<script>
const VERSION = "v1.16.2";
document.getElementById('verTag').textContent = VERSION;
const STRAT_SLOTS = 4;
let loadout = { primary: null, secondary: null, grenade: null, armor: null, stratagems: [null,null,null,null], booster: null };
let activePicker = null; // {slotType, stratIndex}
let activeFaction = ENEMIES[0].faction;
let activeEnemyIdx = 0;
let activePartIdx = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function slotLabel(key) {
  return { primary:"プライマリ武器", secondary:"セカンダリ武器", grenade:"グレネード", armor:"アーマー", booster:"ブースター" }[key];
}

function renderSlotChips() {
  const el = document.getElementById('slotChips');
  el.innerHTML = '';
  ['primary','secondary','grenade','armor'].forEach(key => {
    el.appendChild(makeChip(slotLabel(key), loadout[key] ? loadout[key].name : '未選択', () => openPicker(key)));
  });
  for (let i=0;i<STRAT_SLOTS;i++) {
    const item = loadout.stratagems[i];
    el.appendChild(makeChip('スト'+(i+1), item ? item.name : '未選択', () => openPicker('stratagem', i)));
  }
  el.appendChild(makeChip(slotLabel('booster'), loadout.booster ? loadout.booster.name : '未選択', () => openPicker('booster')));
}

function makeChip(label, value, onClick) {
  const d = document.createElement('div');
  d.className = 'chip' + (value !== '未選択' ? ' filled' : '');
  d.innerHTML = `<span class="lbl">${label}</span><span class="val">${value}</span>`;
  const btn = document.createElement('button');
  btn.textContent = value === '未選択' ? '選択' : '変更';
  btn.onclick = onClick;
  d.appendChild(btn);
  return d;
}

function listFor(slotType) {
  if (slotType === 'primary') return PRIMARY_WEAPONS;
  if (slotType === 'secondary') return SECONDARY_WEAPONS;
  if (slotType === 'grenade') return GRENADES;
  if (slotType === 'armor') return ARMORS;
  if (slotType === 'booster') return BOOSTERS;
  if (slotType === 'stratagem') return STRATAGEMS;
  return [];
}

function categoriesFor(slotType) {
  const items = listFor(slotType);
  const cats = [];
  items.forEach(i => { if (i.category && !cats.includes(i.category)) cats.push(i.category); });
  return cats;
}

let pickerState = { cat: 'すべて', q: '' };

function openPicker(slotType, stratIndex) {
  activePicker = { slotType, stratIndex };
  pickerState = { cat: 'すべて', q: '' };
  renderPicker();
  document.getElementById('pickerSection').style.display = 'block';
  document.getElementById('pickerSection').scrollIntoView({behavior:'smooth', block:'start'});
}

function closePicker() {
  activePicker = null;
  document.getElementById('pickerSection').style.display = 'none';
}

function currentStratagemNames(excludeIndex) {
  const names = [];
  loadout.stratagems.forEach((s, i) => { if (s && i !== excludeIndex) names.push(s.name); });
  return names;
}

function renderPicker() {
  if (!activePicker) return;
  const { slotType, stratIndex } = activePicker;
  const box = document.getElementById('pickerSection');
  const cats = categoriesFor(slotType);
  const titleMap = { primary:"プライマリ武器を選択", secondary:"セカンダリ武器を選択", grenade:"グレネードを選択",
    armor:"アーマーを選択", booster:"ブースターを選択", stratagem:"ストラタジェムを選択（スロット"+(stratIndex+1)+"）" };

  let html = `<div class="picker-head"><b>${titleMap[slotType]}</b><button class="closebtn" onclick="closePicker()">閉じる</button></div>`;
  html += `<div class="tabbar">`;
  html += `<button class="tab ${pickerState.cat==='すべて'?'active':''}" onclick="setPickerCat('すべて')">すべて</button>`;
  cats.forEach(c => { html += `<button class="tab ${pickerState.cat===c?'active':''}" onclick="setPickerCat('${c}')">${c}</button>`; });
  html += `</div>`;
  html += `<input type="search" placeholder="名前で検索" value="${pickerState.q}" oninput="setPickerQuery(this.value)">`;
  html += `<div id="pickerList"></div>`;
  box.innerHTML = html;
  renderPickerList();
}

function setPickerCat(c) { pickerState.cat = c; renderPicker(); }
function setPickerQuery(q) { pickerState.q = q; renderPickerList(); }

function fieldChips(item) {
  const parts = [];
  if (item.damage !== undefined) parts.push('ダメージ ' + item.damage);
  if (item.mag !== undefined) parts.push('装弾数 ' + item.mag);
  if (item.initMag !== undefined) parts.push('マガジン携行' + item.initMag + '/最大' + item.maxMag);
  else if (item.maxMag !== undefined) parts.push('最大携行 ' + item.maxMag);
  if (item.carry !== undefined) parts.push('携行' + item.carry + '/最大' + item.maxCarry);
  if (item.resupply !== undefined) parts.push('補充数 ' + item.resupply);
  if (item.recoil !== undefined) parts.push('反動 ' + item.recoil);
  if (item.rpm !== undefined) parts.push('連射 ' + item.rpm);
  if (item.command !== undefined) parts.push('使用回数 ' + item.uses);
  if (item.cooldown !== undefined) parts.push('CT ' + item.cooldown);
  if (item.rating !== undefined) parts.push('アーマー評価 ' + item.rating);
  if (item.cost !== undefined) parts.push('メダル ' + item.cost);
  if (item.rounds !== undefined) parts.push('1回の要請で ' + item.rounds);
  if (item.ammo !== undefined) parts.push('弾薬 ' + item.ammo);
  if (item.pen !== undefined && item.pen !== null) parts.push('貫通 ' + TIER_LABEL[item.pen]);
  return parts;
}

function renderPickerList() {
  const { slotType, stratIndex } = activePicker;
  let items = listFor(slotType);
  if (pickerState.cat !== 'すべて') items = items.filter(i => i.category === pickerState.cat);
  if (pickerState.q) items = items.filter(i => i.name.includes(pickerState.q));
  const usedElsewhere = slotType === 'stratagem' ? currentStratagemNames(stratIndex) : [];
  const currentVal = slotType === 'stratagem' ? loadout.stratagems[stratIndex] : loadout[slotType];

  let html = '';
  items.forEach((item, idx) => {
    const disabled = usedElsewhere.includes(item.name);
    const selected = currentVal && currentVal.name === item.name;
    html += `<div class="itemcard ${selected?'selected':''} ${disabled?'disabled':''}" ${disabled?'':`onclick="pickItem('${slotType}', ${stratIndex ?? 'null'}, ${idx}, '${pickerState.cat}', '${pickerState.q.replace(/'/g,"\\'")}')"`}>`;
    html += `<div class="name">${item.name}${selected?' ✓':''}${disabled?' (使用中)':''}</div>`;
    if (item.category) html += `<div class="cat">${item.category}</div>`;
    const chips = fieldChips(item);
    if (chips.length) {
      html += `<div class="statrow">`;
      chips.forEach(c => html += `<span class="stat">${c}</span>`);
      html += `</div>`;
    }
    if (item.traits) html += `<div class="traits">${item.traits.join('・')}</div>`;
    if (item.desc) html += `<div class="traits">${item.desc}</div>`;
    html += `</div>`;
  });
  if (items.length === 0) html = '<p class="hint">該当する項目がありません</p>';
  document.getElementById('pickerList').innerHTML = html;
}

function pickItem(slotType, stratIndex, idx, cat, q) {
  let items = listFor(slotType);
  if (cat !== 'すべて') items = items.filter(i => i.category === cat);
  if (q) items = items.filter(i => i.name.includes(q));
  const item = items[idx];
  if (!item) return;
  if (slotType === 'stratagem') {
    loadout.stratagems[stratIndex] = item;
  } else {
    loadout[slotType] = item;
  }
  renderSlotChips();
  closePicker();
  renderEnemyBody();
}

function clearLoadout() {
  loadout = { primary: null, secondary: null, grenade: null, armor: null, stratagems: [null,null,null,null], booster: null };
  renderSlotChips();
  renderEnemyBody();
  showToast('ロードアウトをクリアしました');
}

function saveLoadout() {
  const name = document.getElementById('saveName').value.trim();
  if (!name) { showToast('保存名を入力してください'); return; }
  const all = getSavedLoadouts();
  all.push({ name, loadout: JSON.parse(JSON.stringify(loadout)), savedAt: new Date().toISOString() });
  localStorage.setItem('hd2_loadouts', JSON.stringify(all));
  document.getElementById('saveName').value = '';
  renderSavedList();
  showToast('「'+name+'」を保存しました');
}

function getSavedLoadouts() {
  try { return JSON.parse(localStorage.getItem('hd2_loadouts') || '[]'); } catch(e) { return []; }
}

function renderSavedList() {
  const all = getSavedLoadouts();
  const el = document.getElementById('savedList');
  if (all.length === 0) { el.innerHTML = '<p class="hint">まだ保存されたロードアウトはありません</p>'; return; }
  let html = '';
  all.forEach((entry, i) => {
    const l = entry.loadout;
    html += `<div class="loadout-card">`;
    html += `<div class="title"><b>${entry.name}</b><span>`;
    html += `<button class="smallbtn" onclick="loadLoadout(${i})">呼び出す</button>`;
    html += `<button class="smallbtn" onclick="deleteLoadout(${i})">削除</button>`;
    html += `</span></div>`;
    const tags = [];
    ['primary','secondary','grenade','armor'].forEach(k => { if (l[k]) tags.push(`<span class="tag">${l[k].name}</span>`); });
    (l.stratagems||[]).forEach(s => { if (s) tags.push(`<span class="tag strat">${s.name}</span>`); });
    if (l.booster) tags.push(`<span class="tag boost">${l.booster.name}</span>`);
    html += tags.join('');
    html += `</div>`;
  });
  el.innerHTML = html;
}

function loadLoadout(i) {
  const all = getSavedLoadouts();
  const entry = all[i];
  if (!entry) return;
  loadout = entry.loadout;
  if (!loadout.stratagems) loadout.stratagems = [null,null,null,null];
  renderSlotChips();
  renderEnemyBody();
  showToast('「'+entry.name+'」を呼び出しました');
  window.scrollTo({top:0, behavior:'smooth'});
}

function deleteLoadout(i) {
  const all = getSavedLoadouts();
  all.splice(i, 1);
  localStorage.setItem('hd2_loadouts', JSON.stringify(all));
  renderSavedList();
}

// ---- 装備データ一覧（閲覧のみ） ----
let browseOpen = false;
function toggleBrowse() {
  browseOpen = !browseOpen;
  document.getElementById('browseBody').style.display = browseOpen ? 'block' : 'none';
  document.getElementById('browseToggleIcon').textContent = browseOpen ? '▼' : '▶';
}

const BROWSE_TYPES = [
  ['primary','プライマリ武器'], ['secondary','セカンダリ武器'], ['grenade','グレネード'],
  ['armor','アーマー'], ['booster','ブースター'], ['stratagem','ストラタジェム'],
];
let browseState = { type: 'primary', cat: 'すべて', q: '' };

function renderBrowseTypeTabs() {
  let html = '';
  BROWSE_TYPES.forEach(([t, label]) => {
    html += `<button class="tab ${browseState.type===t?'active':''}" onclick="setBrowseType('${t}')">${label}</button>`;
  });
  document.getElementById('browseTypeTabs').innerHTML = html;
}

function setBrowseType(t) {

  browseState.cat = 'すべて';

  renderBrowseCatTabs();
  renderBrowseList();
}

function renderBrowseCatTabs() {

function setBrowseCat(c) { browseState.cat = c; renderBrowseList(); }
function setBrowseQuery(q) { browseState.q = q; renderBrowseList(); }

function renderBrowseList() {
  let items = listFor(browseState.type);
  if (browseState.cat !== 'すべて') items = items.filter(i => i.category === browseState.cat);
  if (browseState.q) items = items.filter(i => i.name.includes(browseState.q));

    html += `</div>`;
  });

let enemyOpen = false;
function toggleEnemy() {

  document.getElementById('enemyToggleIcon').textContent = enemyOpen ? '▼' : '▶';

  return fs;
}

function renderFactionTabs() {

}

function setFaction(f) {
  activeFaction = f;
  const idxs = ENEMIES.map((e,i)=>i).filter(i => ENEMIES[i].faction === f);
  activeEnemyIdx = idxs[0];

function renderEnemyChips() {

    html += `<button class="tab ${activeEnemyIdx===i?'active':''}" onclick="setEnemy(${i})">${e.name}</button>`;

function allPenItems() {
  return [].concat(PRIMARY_WEAPONS, SECONDARY_WEAPONS, GRENADES, STRATAGEMS).filter(i => i.pen);
}

function equipFromLookup(slot, name) {
  const item = allPenItems().find(i => i.slot === slot && i.name === name);
  if (!item) return;
  if (slot === 'stratagem') {
    const already = loadout.stratagems.findIndex(s => s && s.name === item.name);
    if (already >= 0) { showToast('すでにスロット'+(already+1)+'に設定済みです'); return; }
    const empty = loadout.stratagems.findIndex(s => !s);
    if (empty < 0) { showToast('ストラタジェムは4つとも埋まっています'); return; }
    loadout.stratagems[empty] = item;
    showToast('「'+item.name+'」をストラタジェム'+(empty+1)+'に設定しました');
  } else {
    loadout[slot] = item;
    showToast('「'+item.name+'」を'+slotLabel(slot)+'に設定しました');
  }
  renderSlotChips();
  renderEnemyBody();
  closeItemDetail();
}

function lookupButton(it, partHp, rate, cls) {
  let hitLabel = '';
  if (typeof it.damage === 'number' && it.damage > 0) {
    const eff = it.damage * rate;
    const hits = Math.ceil(partHp / eff);
    hitLabel = `（${hits}発目安`;
    hitLabel += it.rounds ? `・1回で${it.rounds}／全弾命中は想定せず` : '';
    hitLabel += `）`;
  }
  const nameEsc = it.name.replace(/'/g,"\\'");
  return `<span class="lookup-item">`
    + `<button class="lookup-btn ${cls} slot-${it.slot}" onclick="equipFromLookup('${it.slot}', '${nameEsc}')">${it.name}${hitLabel}</button>`
    + `<button class="lookup-detail-btn" aria-label="詳細を見る" onclick="showItemDetail('${it.slot}', '${nameEsc}')">ⓘ</button>`
    + `</span>`;
}

function slotLegend() {
  const labels = [
    ['primary', 'プライマリ', '#993556'],
    ['secondary', 'セカンダリ', '#0C447C'],
    ['grenade', 'グレネード', '#712B13'],
    ['stratagem', 'ストラタジェム', '#085041'],
  ];
  return `<div class="lookup-legend">` + labels.map(([,label,color]) =>
    `<span><span class="dot" style="background:${color}"></span>${label}</span>`).join('') + `</div>`;
}

let lookupDetailKey = null; // "slot|name" の形式。モーダルに表示する対象を示すためだけに使う

function showItemDetail(slotType, name) {
  lookupDetailKey = slotType + '|' + name;
  renderItemDetailModal();
}

function closeItemDetail() {
  lookupDetailKey = null;
  document.getElementById('itemDetailOverlay').style.display = 'none';
  document.getElementById('itemDetailBox').innerHTML = '';
}

function renderItemDetailModal() {
  if (!lookupDetailKey) return;
  const [slotType, name] = lookupDetailKey.split('|');
  const item = allPenItems().find(i => i.slot === slotType && i.name === name);
  if (!item) return;
  const chips = fieldChips(item);
  let html = `<div class="name">${item.name}</div>`;
  if (item.category) html += `<div class="cat">${item.category}</div>`;
  if (chips.length) {
    html += `<div class="statrow">`;
    chips.forEach(c => html += `<span class="stat">${c}</span>`);
    html += `</div>`;
  }
  if (item.traits) html += `<div class="traits">${item.traits.join('・')}</div>`;
  if (item.desc) html += `<div class="traits">${item.desc}</div>`;
  html += `<button class="btn" style="margin-top:8px;" onclick="equipFromLookup('${item.slot}', '${name.replace(/'/g,"\\'")}')">このスロットに装備する</button>`;
  html += `<button class="btn" style="margin-top:8px; margin-left:6px;" onclick="closeItemDetail()">閉じる</button>`;
  document.getElementById('itemDetailBox').innerHTML = html;
  document.getElementById('itemDetailOverlay').style.display = 'flex';
}

function renderEnemyBody() {
  const enemy = ENEMIES[activeEnemyIdx];
  if (!enemy) return;
  let html = `<div class="enemy-grid">`;
  enemy.parts.forEach((p, i) => {
    const [name, hp, tier, fatal] = p;
    html += `<div class="part-card ${activePartIdx===i?'selected':''}" onclick="setPart(${i})">`;
    html += `<div class="pname">${name}</div>`;
    html += `<div class="psub">HP ${hp}</div>`;
    html += `<div class="psub">装甲 ${TIER_LABEL[tier]}</div>`;
    html += `<span class="badge ${fatal?'fatal':'nonfatal'}">${fatal?'破壊で即撃破':'破壊しても倒れない'}</span>`;
    html += `</div>`;
  });
  html += `</div>`;

  if (activePartIdx !== null) {
    const [pname, php, ptier, pfatal] = enemy.parts[activePartIdx];
    const items = allPenItems();
    const full = [], half = [];
    items.forEach(it => {
      const r = calcPenResult(it.pen, ptier);
      if (r === 'full') full.push(it);
      else if (r === 'half') half.push(it);
    });
    const hitsFor = (it, rate) => (typeof it.damage === 'number' && it.damage > 0)
      ? Math.ceil(php / (it.damage * rate)) : Infinity;
    full.sort((a, b) => hitsFor(a, 1) - hitsFor(b, 1));
    half.sort((a, b) => hitsFor(a, 0.65) - hitsFor(b, 0.65));
    html += `<div class="section" style="margin-top:10px;">`;
    html += `<p><b>${enemy.name}「${pname}」</b>（${TIER_LABEL[ptier]}・<span style="color:${pfatal?'var(--danger)':'var(--sub)'}">${pfatal?'破壊で即撃破':'破壊しても倒れない'}</span>）を貫通できる装備</p>`;
    html += slotLegend();
    html += `<div class="lookup-group"><p class="lookup-title full">通常ダメージ100%で貫通</p>`;
    if (full.length === 0) html += `<p class="hint">該当なし</p>`;
    full.forEach(it => { html += lookupButton(it, php, 1, 'full'); });
    html += `</div>`;
    html += `<div class="lookup-group"><p class="lookup-title half">ダメージ65%に減衰（同格）</p>`;
    if (half.length === 0) html += `<p class="hint">該当なし</p>`;
    half.forEach(it => { html += lookupButton(it, php, 0.65, 'half'); });
    html += `</div>`;
    html += `<p class="hint">かっこ内は破壊に必要な目安発数（単発ダメージ×有効率でその部位HPを割った概算。連射武器・レーザー系は目安対象外）。クリックで対応スロットに即セットされます（ストラタジェムは空いているスロットに自動配置）。ランク付けは両wikiの記載に基づく近似です。</p>`;
    html += `</div>`;
  } else {
    html += `<p class="hint">部位をクリックすると、その部位を貫通できる装備が表示されます</p>`;
  }
  document.getElementById('enemyBody').innerHTML = html;
  if (lookupDetailKey) renderItemDetailModal();
}

  document.getElementById('simBody').style.display = simOpen ? 'block' : 'none';
  document.getElementById('simToggleIcon').textContent = simOpen ? '▼' : '▶';
}
let simTargets = [];

function populateSimEnemySelect() {

  el.innerHTML = ENEMIES.map((e, i) => `<option value="${i}">${e.faction}・${e.name}</option>`).join('');

function onSimEnemyChange() {

  const el = document.getElementById('simPartSelect');

}

let simQty = 1;
function stepSimQty(delta) {
  simQty = Math.max(1, Math.min(99, simQty + delta));
  document.getElementById('simQtyDisplay').textContent = simQty;
}

function addSimTarget() {
  const eIdx = Number(document.getElementById('simEnemySelect').value);
  const pIdx = Number(document.getElementById('simPartSelect').value);
  const qty = simQty;
  const enemy = ENEMIES[eIdx];
  const part = enemy.parts[pIdx];
  simTargets.push({ hp: part[1], tier: part[2], qty, enemyName: enemy.name, partName: part[0] });
  renderSimTargets();
}

function removeSimTarget(i) {
  simTargets.splice(i, 1);
  renderSimTargets();
}

function stepTargetQty(i, delta) {
  simTargets[i].qty = Math.max(1, Math.min(99, simTargets[i].qty + delta));
  renderSimTargets();
}

function renderSimTargets() {
  const el = document.getElementById('simTargetList');
  if (simTargets.length === 0) {
    el.innerHTML = '<p class="hint">対象を追加してください（例：バイルタイタン「頭部」×2、チャージャー「頭部」×3）</p>';
  } else {
    el.innerHTML = simTargets.map((t, i) =>
      `<span class="chip filled target">
        <span class="val">${t.enemyName}「${t.partName}」</span>
        <button class="smallbtn" onclick="stepTargetQty(${i},-1)">−</button>
        <span class="qtyval">${t.qty}</span>
        <button class="smallbtn" onclick="stepTargetQty(${i},1)">＋</button>
        <button onclick="removeSimTarget(${i})">×</button>
      </span>`
    ).join('');
  }
  renderSimResult();
}

function simWeaponStats(name) {
  const timing = WEAPON_TIMING[name];
  if (typeof timing.damage === 'number' && typeof timing.pen === 'number') {
    return { pen: timing.pen, damage: timing.damage };
  }
  const strat = STRATAGEMS.find(s => s.name === name);
  if (!strat || typeof strat.damage !== 'number') return null;
  return { pen: strat.pen, damage: strat.damage };
}

function calcShotsNeeded(pen, damage, targets) {
  let total = 0;
  for (const t of targets) {
    const r = calcPenResult(pen, t.tier);
    if (r === 'none') return null;
    const rate = r === 'full' ? 1 : 0.65;
    total += Math.ceil(t.hp / (damage * rate)) * t.qty;
  }
  return total;
}

function calcWeaponTime(timing, totalShots) {
  if (totalShots <= 0) return 0;
  if (timing.type === 'charge') {
    return timing.charge * totalShots + timing.cooldown * (totalShots - 1);
  }
  if (timing.type === 'mag') {
    const reloads = Math.floor((totalShots - 1) / timing.magazine);
    return reloads * timing.reload + (timing.lockOn || 0) * totalShots;
  }
  if (timing.type === 'callLimited') {
    const recalls = Math.floor((totalShots - 1) / timing.freeUses);
    return recalls * (timing.callInCooldown + timing.callInTime);
  }
  if (timing.type === 'carryLimited') {
    if (totalShots > timing.maxShots) return 'insufficient';
    return timing.perShotInterval * totalShots;
  }
  return null;
}

let simExcluded = new Set();

const SIM_DETAIL_MAP = {
  'レールガン（アンセーフ最大）': { slot: 'stratagem', name: 'レールガン' },
  'レールガン（セーフ）': { slot: 'stratagem', name: 'レールガン' },
  'ミサイルピストル': { slot: 'secondary', name: 'P-33 ミサイルピストル' },
  'ブリーチャー': { slot: 'secondary', name: 'P-34 ブリーチャー' },
  'アルティメイタム': { slot: 'secondary', name: 'GP-20 アルティメイタム' },
  '対戦車シーカー': { slot: 'grenade', name: 'G-60 対戦車シーカー' },
  'メルタマイン': { slot: 'grenade', name: 'G/40-K メルタマイン' },
  'テルミット': { slot: 'grenade', name: 'G-123 テルミット' },
};
function simDetailTarget(name) {
  return SIM_DETAIL_MAP[name] || { slot: 'stratagem', name };
}

function showSimDetail(simName) {
  const dt = simDetailTarget(simName);
  const item = allPenItems().find(i => i.slot === dt.slot && i.name === dt.name);
  if (!item) return;
  const override = WEAPON_TIMING[simName];
  const effectiveDamage = (override && typeof override.damage === 'number') ? override.damage : item.damage;
  const chips = fieldChips(Object.assign({}, item, { damage: effectiveDamage }));
  let html = `<div class="name">${simName}</div>`;
  if (item.category) html += `<div class="cat">${item.category}</div>`;
  if (chips.length) {
    html += `<div class="statrow">`;
    chips.forEach(c => html += `<span class="stat">${c}</span>`);
    html += `</div>`;
  }
  if (item.traits) html += `<div class="traits">${item.traits.join('・')}</div>`;
  if (item.desc) html += `<div class="traits">${item.desc}</div>`;
  html += `<button class="btn" style="margin-top:8px;" onclick="closeItemDetail()">閉じる</button>`;
  document.getElementById('itemDetailBox').innerHTML = html;
  document.getElementById('itemDetailOverlay').style.display = 'flex';
}

const SIM_GROUPS = {
  secondary: { label: 'セカンダリ', names: ['ミサイルピストル', 'ブリーチャー', 'アルティメイタム'] },
  grenade: { label: 'グレネード', names: ['対戦車シーカー', 'メルタマイン', 'テルミット'] },
};

function excludeSimWeapon(name) {
  simExcluded.add(name);
  renderSimResult();
}

function restoreSimWeapon(name) {
  simExcluded.delete(name);
  renderSimResult();
}

function toggleSimGroup(groupKey) {
  const names = SIM_GROUPS[groupKey].names;
  const allExcluded = names.every(n => simExcluded.has(n));
  names.forEach(n => allExcluded ? simExcluded.delete(n) : simExcluded.add(n));
  renderSimResult();
}

function renderSimGroupToggles() {
  const el = document.getElementById('simGroupToggles');
  let html = '';
  Object.keys(SIM_GROUPS).forEach(key => {
    const g = SIM_GROUPS[key];
    const allExcluded = g.names.every(n => simExcluded.has(n));
    html += `<button class="btn${allExcluded ? '' : ' primary'}" onclick="toggleSimGroup('${key}')">${g.label}枠${allExcluded ? 'を含める' : 'を除外'}</button>`;
  });
  el.innerHTML = html;
}

function renderSimResult() {
  renderSimGroupToggles();
  const el = document.getElementById('simResult');
  if (simTargets.length === 0) { el.innerHTML = ''; return; }
  const rows = [];
  Object.keys(WEAPON_TIMING).forEach(name => {
    if (simExcluded.has(name)) return;
    const stats = simWeaponStats(name);
    if (!stats) return;
    const shots = calcShotsNeeded(stats.pen, stats.damage, simTargets);
    if (shots === null) { rows.push({ name, na: true }); return; }
    const time = calcWeaponTime(WEAPON_TIMING[name], shots);
    if (time === 'insufficient') { rows.push({ name, shots, insufficient: true }); return; }
    rows.push({ name, shots, time });
  });
  const rank = r => r.na ? 2 : r.insufficient ? 1 : 0;
  rows.sort((a, b) => {
    const ra = rank(a), rb = rank(b);
    if (ra !== rb) return ra - rb;
    return ra === 0 ? a.time - b.time : 0;
  });
  let html = `<table style="width:100%; border-collapse:collapse; font-size:13px;">`;
  html += `<tr style="color:var(--sub); text-align:left;"><th>武器</th><th>必要発数</th><th>推定時間</th><th></th></tr>`;
  rows.forEach(r => {
    html += `<tr style="border-top:1px solid var(--border);">`;
    html += `<td style="padding:5px 4px;">${r.name}</td>`;
    if (r.na) {
      html += `<td colspan="2" style="padding:5px 4px; color:var(--sub);">貫通不可（対象外）</td>`;
    } else if (r.insufficient) {
      html += `<td style="padding:5px 4px;">${r.shots}発</td>`;
      html += `<td style="padding:5px 4px; color:var(--sub);">携行数不足（補充前提で未計算）</td>`;
    } else {
      html += `<td style="padding:5px 4px;">${r.shots}発</td>`;
      html += `<td style="padding:5px 4px; font-weight:bold;">${Math.round(r.time)}秒</td>`;
    }
    html += `<td style="padding:5px 4px; text-align:right; white-space:nowrap;">`;
    html += `<button class="smallbtn" onclick="showSimDetail('${r.name.replace(/'/g,"\\'")}')">ⓘ</button>`;
    html += `<button class="smallbtn" onclick="excludeSimWeapon('${r.name.replace(/'/g,"\\'")}')">除外</button>`;
    html += `</td>`;
    html += `</tr>`;
  });
  html += `</table>`;
  if (simExcluded.size > 0) {
    html += `<div class="chips" style="margin-top:8px;">`;
    html += `<span class="hint" style="width:100%;">除外中：</span>`;
    Array.from(simExcluded).forEach(name => {
      html += `<span class="chip"><span class="val">${name}</span><button onclick="restoreSimWeapon('${name.replace(/'/g,"\\'")}')">戻す</button></span>`;
    });
    html += `</div>`;
  }
  html += `<p class="hint">初期携行分（最初の1マガジン/要請分）は「すでに手元にある」前提でカウントせず、弾切れ後の再要請・リロードのみを加算した目安です。チャージ・リロード秒数はソロ運用（アシスト無し）の値。弾薬が有限な武器（レールガン等）も、計算対象の発数が現実的な携行弾数を超えないという前提で簡略化しています。グレネード・セカンダリの対戦車ランク装備は携行数上限までのみ計算し、補充タイミングは未モデル化（上限を超える分は「携行数不足」と表示）。エイペックス・エポックはwiki側の秒数データが不完全なため未収録。</p>`;
  document.getElementById('simResult').innerHTML = html;
}

// init
renderSlotChips();
renderSavedList();
renderFactionTabs();
renderEnemyChips();
renderEnemyBody();
renderBrowseTypeTabs();
renderBrowseCatTabs();
renderBrowseList();
populateSimEnemySelect();
renderSimTargets();
